{% extends "base.html" %}
{% block title %}Edit Waste{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0">Edit Waste Record</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('edit_waste', id=waste.id) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="food_name" class="form-label fw-bold">Food Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="food_name" name="food_name" value="{{ waste.food_name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="category" class="form-label fw-bold">Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" name="category" required>
                                {% for cat in categories %}
                                <option value="{{ cat }}" {% if waste.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="quantity" class="form-label fw-bold">Quantity <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="quantity" name="quantity" value="{{ waste.quantity }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="unit" class="form-label fw-bold">Unit <span class="text-danger">*</span></label>
                                <select class="form-select" id="unit" name="unit" required>
                                    {% for u in units %}
                                    <option value="{{ u }}" {% if waste.unit == u %}selected{% endif %}>{{ u }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="date" class="form-label fw-bold">Waste Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="date" name="date" value="{{ waste.date.strftime('%Y-%m-%d') }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="reason" class="form-label fw-bold">Reason <span class="text-danger">*</span></label>
                            <select class="form-select" id="reason" name="reason" required>
                                {% for r in reasons %}
                                <option value="{{ r }}" {% if waste.reason == r %}selected{% endif %}>{{ r }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="disposal_method" class="form-label fw-bold">Disposal Method <span class="text-danger">*</span></label>
                            <select class="form-select" id="disposal_method" name="disposal_method" required>
                                {% for d in disposals %}
                                <option value="{{ d }}" {% if waste.disposal_method == d %}selected{% endif %}>{{ d }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="notes" class="form-label fw-bold">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="2">{{ waste.notes if waste.notes else '' }}</textarea>
                        </div>

                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-start">
                            <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
                            <a href="{{ url_for('waste_list') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
