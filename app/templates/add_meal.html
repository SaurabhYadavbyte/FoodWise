{% extends "base.html" %}
{% block title %}Add Meal Plan{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0">Add Meal Plan</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('add_meal') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="plan_date" class="form-label fw-bold">Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="plan_date" name="plan_date" value="{{ form.plan_date if form else '' }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="meal_type" class="form-label fw-bold">Meal Type <span class="text-danger">*</span></label>
                            <select class="form-select" id="meal_type" name="meal_type" required>
                                <option value="" disabled {% if not form or not form.meal_type %}selected{% endif %}>Select Meal Type</option>
                                {% for m_type in meal_types %}
                                <option value="{{ m_type }}" {% if form and form.meal_type == m_type %}selected{% endif %}>{{ m_type }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="meal_name" class="form-label fw-bold">Meal Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="meal_name" name="meal_name" value="{{ form.meal_name if form else '' }}" placeholder="e.g. Vegetable Rice" required>
                        </div>

                        <div class="mb-4">
                            <label for="notes" class="form-label fw-bold">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="e.g. Use vegetables from refrigerator">{{ form.notes if form else '' }}</textarea>
                        </div>

                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-start">
                            <button type="submit" class="btn btn-primary btn-lg">Save Meal Plan</button>
                            <a href="{{ url_for('meal_planner') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
