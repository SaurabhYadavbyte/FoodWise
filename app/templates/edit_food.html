{% extends "base.html" %}
{% block title %}Edit Food{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0">Edit Food Item</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('edit_food', id=food.id) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Food Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ food.name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="category" class="form-label fw-bold">Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" name="category" required>
                                {% for cat in categories %}
                                <option value="{{ cat }}" {% if food.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="quantity" class="form-label fw-bold">Quantity <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="quantity" name="quantity" value="{{ food.quantity }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="unit" class="form-label fw-bold">Unit <span class="text-danger">*</span></label>
                                <select class="form-select" id="unit" name="unit" required>
                                    {% for u in units %}
                                    <option value="{{ u }}" {% if food.unit == u %}selected{% endif %}>{{ u }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="purchase_date" class="form-label fw-bold">Purchase Date</label>
                                <input type="date" class="form-control" id="purchase_date" name="purchase_date" value="{{ food.purchase_date.strftime('%Y-%m-%d') if food.purchase_date else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="expiry_date" class="form-label fw-bold">Expiry Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="expiry_date" name="expiry_date" value="{{ food.expiry_date.strftime('%Y-%m-%d') }}" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="storage_location" class="form-label fw-bold">Storage Location <span class="text-danger">*</span></label>
                            <select class="form-select" id="storage_location" name="storage_location" required>
                                {% for loc in locations %}
                                <option value="{{ loc }}" {% if food.storage_location == loc %}selected{% endif %}>{{ loc }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-start">
                            <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
                            <a href="{{ url_for('food_list') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
